# Configuración Recomendada de Alias Apache para XAMPP en Windows
# Pegar este bloque al final de C:\xampp\apache\conf\httpd.conf o en httpd-vhosts.conf

# OPCIÓN A: Usar la carpeta directa del proyecto (RECOMENDADO - No requiere copiar archivos)
Alias /gestion_academica "C:/Users/USER/AndroidStudioProjects/APP_Grupo9/backend/public"

<Directory "C:/Users/USER/AndroidStudioProjects/APP_Grupo9/backend/public">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    </IfModule>
</Directory>

# OPCIÓN B: Si se copiaron los archivos a C:/xampp/apps/gestion_academica/backend/public
<Directory "C:/xampp/apps/gestion_academica/backend/public">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
</Directory>
